name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # The page serves the committed bundle (Pages deploys the branch as it is), so the bundle
      # in the PR must be exactly what the pinned Duro version builds.
      - run: pnpm build
      - name: The committed bundle is current
        run: git diff --exit-code -- theme-pane.js theme-pane.css
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
