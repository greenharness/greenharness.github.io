name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  site:
    # Playwright 1.58.2 installs no browser on ubuntu-latest once it is 26.04 (refused 2026-11-20).
    # holds-until: Playwright supports chromium on ubuntu 26.04 (or 24.04 is retired); revisit then.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # The page serves the committed bundle (Pages deploys the branch as it is), so the bundle
      # in the PR must be exactly what the pinned greenrack version builds.
      - run: pnpm build
      - name: The committed bundle is current
        run: git diff --exit-code -- theme-pane.js theme-pane.css
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
